[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "efospec"
version = "0.1.0"
description = "EFOSpec: EFOSC2 calibration planning and experimental PypeIt reduction"
requires-python = ">=3.9"
dependencies = ["astropy>=6,<8", "requests>=2.28,<3"]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<6.13"]
desktop-test = ["pytest-qt>=4.4,<5"]
# PypeIt 1.14 imports pkg_resources at runtime (removed in setuptools 82).
rapid = ["pypeit==1.14.0", "scipy>=1.9", "matplotlib>=3.5", "setuptools>=61,<82"]
plots = ["matplotlib>=3.5", "scipy>=1.9", "SciencePlots", "pypalettes"]
desktop = ["PyQt6>=6,<7", "matplotlib>=3.5", "scipy>=1.9", "SciencePlots", "pypalettes"]
test = ["pytest>=7,<9", "pytest-cov>=4,<7", "build>=1,<2", "playwright>=1.50,<2", "PyQt6>=6,<7"]

[project.scripts]
efospec = "efospec.__main__:main"
# Compatibility for existing observer scripts.
epessto-plus = "efospec.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["efospec"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.setuptools.package-data]
efospec = ["web/*.html", "web/*.css", "web/*.js", "assets/*.svg", "assets/*.png"]
