[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epessto-plus"
version = "0.1.0"
description = "EFOSC2 calibration planning and experimental PypeIt rapid reduction"
requires-python = ">=3.9"
dependencies = ["astropy>=6,<8"]

[project.scripts]
epessto-plus = "epessto_plus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
